name: Integration bug
description: A Taskade trigger, action or search on Zapier, n8n or Make does not work as expected.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **This issue is public.** Everyone on the internet can read it.
        Do not paste an API token, an email address, a name, or a link to a private workspace or project.
        Replace them with placeholders such as `TOKEN`, `jane@example.com` and `PROJECT_ID`.
        For help with your own account, use [taskade.com/contact](https://www.taskade.com/contact).
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This issue holds no token, no email address and no link to a private workspace or project.
          required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Zapier
        - n8n
        - Make
    validations:
      required: true
  - type: input
    id: operation
    attributes:
      label: Trigger, action or search
      description: The name that you see on the platform, for example "Create Task" or "New Comment".
      placeholder: Create Task
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Include the error message. Remove every token, email address and private link first.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add the "Create Task" action to a Zap.
        2. Select a project.
        3. Test the action.
  - type: input
    id: version
    attributes:
      label: App version
      description: For example, the Zapier app version or the n8n-nodes-taskade version. Leave it empty if you do not know.
